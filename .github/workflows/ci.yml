name: CI
# Pull requests: lint, tests (PostgreSQL), image build (no push), Trivy, gitleaks, PR comment.
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: rgrishabh/hrms-deployment/.github/workflows/_app-ci.yml@main
    with:
      app: backend
      postgres: true
  openapi:
    name: OpenAPI document
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # No database. Exits non-zero if any route has no schema; test/openapi.test.ts checks the detail.
      - run: npm run openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
