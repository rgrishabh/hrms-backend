name: Security
# Static and dynamic scans. Pull requests: Semgrep, CodeQL, Trivy on the repository, SBOM, ZAP baseline.
# Nightly: the same, plus a full ZAP scan. Findings at the gates fail the run.
# No long-lived cloud keys anywhere: nothing here talks to a cloud. Not yet run on GitHub: validated with actionlint only.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 # 1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/owasp-top-ten --config p/nodejs --config p/typescript --severity ERROR --error --metrics off --exclude openapi.json src

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  trivy-and-sbom:
    name: Trivy (repository), SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy on the repository (fail on HIGH or CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM of the repository (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  zap:
    name: ZAP (baseline on pull requests, full nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_MIGRATION_URL: postgres://hrms_owner:ci_owner@localhost:5432/hrms_scan
      DATABASE_URL: postgres://hrms_app:ci_app@localhost:5432/hrms_scan
      BRAND_DOMAIN: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Database
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hrms_owner LOGIN PASSWORD 'ci_owner' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE ROLE hrms_app LOGIN PASSWORD 'ci_app' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE hrms_scan OWNER hrms_owner"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node -e "import('./dist/src/db/migrate.js').then((m) => m.migrate(process.env.DATABASE_MIGRATION_URL, () => undefined))"
      - name: Start the API
        run: |
          scripts/ci-serve.sh > serve.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:4200/health/live && exit 0; sleep 1; done
          cat serve.log; exit 1
      - name: Baseline
        if: github.event_name != 'schedule'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:4200/api/v1/config/public
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: Full
        if: github.event_name == 'schedule'
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://localhost:4200/api/v1/config/public
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          artifact_name: zap-full
